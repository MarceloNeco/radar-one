# Roda em todo PR as duas provas de que nada regrediu (ADR 0001, plano da F1):
#   1. as 913 verificações do app (teste/rodar.js)
#   2. o autoteste do harness de paridade dos 43 infográficos (teste/paridade.js)
#   3. a auditoria de acessibilidade do Lighthouse nas quatro telas do shell, perfil de celular (F1-PR5)
# Os jobs andam em paralelo. Só leitura: nada é publicado nem gravado no repositório.
name: Testes - 913 verificações e paridade

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacoes:
    name: 913 verificações
    runs-on: ubuntu-24.04   # "ubuntu-latest" já é o 26.04, que o Playwright 1.56 não suporta (CI de 31/10/2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar o Playwright (mesma versão do container de teste)
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Rodar as verificações
        run: NODE_PATH="$(npm root -g)" node teste/rodar.js

  paridade:
    name: Paridade dos infográficos (autoteste)
    runs-on: ubuntu-24.04   # "ubuntu-latest" já é o 26.04, que o Playwright 1.56 não suporta (CI de 31/10/2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar o Playwright (mesma versão do container de teste)
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Autoteste (atual × atual = 0 diferenças; Selic alterada acusa só os blocos certos)
        run: NODE_PATH="$(npm root -g)" node teste/paridade.js autoteste
      - name: Guardar os resumos da captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-resumos
          path: teste/paridade/*/resumo.json
          if-no-files-found: ignore
          retention-days: 14

  acessibilidade:
    name: Acessibilidade (Lighthouse, celular)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Servir o site e auditar as telas do shell (F1-PR5; o Chrome já vem no runner)
        run: |
          python3 -m http.server 8780 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          mkdir -p lh
          for h in hoje explorar infograficos salvos; do
            npx -y lighthouse@12 "http://127.0.0.1:8780/#$h" --only-categories=accessibility --form-factor=mobile --screenEmulation.mobile \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu" --quiet --output=json --output-path="lh/$h.json"
          done
      - name: Conferir (nota ≥ 90 e nenhuma auditoria crítica reprovada)
        run: |
          node -e '
            const fs = require("fs"); let ruim = false;
            for (const f of fs.readdirSync("lh").filter(x => x.endsWith(".json"))) {
              const r = JSON.parse(fs.readFileSync("lh/" + f, "utf8")), c = r.categories.accessibility, nota = Math.round(c.score * 100);
              const falhas = c.auditRefs.map(a => r.audits[a.id]).filter(a => a.score !== null && a.score < 1);
              console.log(f.replace(".json", "") + ": acessibilidade " + nota + (falhas.length ? " · reprovadas: " + falhas.map(a => a.id).join(", ") : " · nenhuma auditoria reprovada"));
              if (nota < 90) ruim = true;
            }
            process.exit(ruim ? 1 : 0);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-acessibilidade
          path: lh/*.json
          retention-days: 14
