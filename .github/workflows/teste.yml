# Roda em todo PR as duas provas de que nada regrediu (ADR 0001, plano da F1):
#   1. as 913 verificações do app (teste/rodar.js)
#   2. o autoteste do harness de paridade dos 43 infográficos (teste/paridade.js)
# Os dois jobs andam em paralelo. Só leitura: nada é publicado nem gravado no repositório.
name: Testes - 913 verificações e paridade

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacoes:
    name: 913 verificações
    runs-on: ubuntu-24.04   # "ubuntu-latest" já é o 26.04, que o Playwright 1.56 não suporta (CI de 31/10/2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # o rodar.js confere o index-en.html gerado pelo sincroniza-en.py
      - name: Instalar o Playwright (mesma versão do container de teste)
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Rodar as verificações
        run: NODE_PATH="$(npm root -g)" node teste/rodar.js

  paridade:
    name: Paridade dos infográficos (autoteste)
    runs-on: ubuntu-24.04   # "ubuntu-latest" já é o 26.04, que o Playwright 1.56 não suporta (CI de 31/10/2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar o Playwright (mesma versão do container de teste)
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Autoteste (atual × atual = 0 diferenças; Selic alterada acusa só os blocos certos)
        run: NODE_PATH="$(npm root -g)" node teste/paridade.js autoteste
      - name: Guardar os resumos da captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridade-resumos
          path: teste/paridade/*/resumo.json
          if-no-files-found: ignore
          retention-days: 14
